<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>instagram follow back checker - copy scripts</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080807;
      --panel: #12110f;
      --panel-soft: #171512;
      --text: #f4f1ea;
      --muted: #a59e93;
      --quiet: #746d64;
      --border: #2a2722;
      --primary: #f4f1ea;
      --primary-strong: #ffffff;
      --primary-text: #11100e;
      --accent: #98d8aa;
      --warn: #f0b36a;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    main {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0 64px;
    }

    header {
      display: grid;
      gap: 14px;
      max-width: 680px;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 8vw, 72px);
      line-height: 1.1;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      max-width: 620px;
    }

    .notice {
      display: inline-flex;
      width: fit-content;
      max-width: 100%;
      margin: 4px 0 28px;
      padding: 8px 11px;
      border: 1px solid #4a3a24;
      border-radius: 8px;
      background: #18120b;
      color: var(--warn);
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }

    .item {
      display: grid;
      gap: 18px;
      min-height: 190px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .item-head {
      display: grid;
      gap: 8px;
    }

    h2 {
      margin: 0;
      font-size: 19px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--quiet);
      font-size: 12px;
    }

    .meta code {
      color: var(--muted);
      background: var(--panel-soft);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 2px 6px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: auto;
    }

    button,
    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 13px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: var(--primary);
      color: var(--primary-text);
      font: inherit;
      font-weight: 650;
      text-decoration: none;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible {
      background: var(--primary-strong);
    }

    a.button.secondary,
    button.secondary {
      background: transparent;
      color: var(--muted);
      border-color: var(--border);
    }

    a.button.secondary:hover,
    button.secondary:hover,
    a.button.secondary:focus-visible,
    button.secondary:focus-visible {
      background: var(--panel-soft);
      color: var(--text);
    }

    .status {
      min-height: 24px;
      margin: 18px 0 0;
      color: var(--accent);
      font-weight: 650;
    }

    .fallback {
      position: fixed;
      inset: auto 16px 16px 16px;
      display: none;
      grid-template-columns: 1fr;
      gap: 8px;
      max-width: 900px;
      margin: 0 auto;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .fallback.visible {
      display: grid;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 10px;
      background: #0d0c0b;
      color: var(--text);
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    @media (max-width: 860px) {
      main {
        width: min(358px, calc(100% - 32px));
        margin-left: 16px;
        margin-right: auto;
        padding: 48px 0 44px;
      }

      header {
        margin-bottom: 24px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .item {
        min-height: auto;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>

      <p>pick a script, copy it, paste it into instagram. nothing installs.</p>
    </header>

    <div class="notice">runs locally in your browser session.</div>

    <section id="items" class="grid" aria-live="polite"></section>
    <div id="status" class="status" role="status"></div>
  </main>

    <div class="actions">
      <button id="selectFallback" type="button">select text</button>
      <button id="closeFallback" type="button" class="secondary">close</button>
    </div>
  </section>

ch)}\u003c/ul\u003e\n      ${optionalFollowingHintReport(result.followingStatusHints)}\n      ${divider}\n      \u003cdetails\u003e\n        \u003csummary\u003ehow this works\u003c/summary\u003e\n        \u003cdiv class=\"footnote\"\u003e\n          only \"not following back\" counts as a miss. every tentative miss was verified with ${escapeHtml(result.verificationMethod)}; accounts that actually follow back were removed, and failures or auth issues are kept in unknown instead of being counted.\u003cbr\u003e\n          profile: ${escapeHtml(formatNumber(result.profileCounts.followers))} followers · ${escapeHtml(formatNumber(result.profileCounts.following))} following. loaded: ${escapeHtml(loadedFollowers)} followers · ${escapeHtml(loadedFollowing)} following.${hintFootnote}\n        \u003c/div\u003e\n      \u003c/details\u003e\n      \u003cdetails\u003e\n        \u003csummary\u003eload passes (debug)\u003c/summary\u003e\n        \u003ctable\u003e\n          \u003cthead\u003e\u003ctr\u003e\u003cth\u003ekind\u003c/th\u003e\u003cth\u003epass\u003c/th\u003e\u003cth\u003ecount\u003c/th\u003e\u003cth\u003epages\u003c/th\u003e\u003cth\u003ebefore\u003c/th\u003e\u003cth\u003eafter\u003c/th\u003e\u003cth\u003eadded\u003c/th\u003e\u003cth\u003estatus\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\n          \u003ctbody\u003e${passRows}\u003c/tbody\u003e\n        \u003c/table\u003e\n        \u003cp\u003efull structured results are in \u003ccode\u003ewindow.IG_FOLLOW_BACK_RESULTS\u003c/code\u003e and \u003ccode\u003ewindow.IG_OVER1K_FOLLOW_BACK_RESULTS\u003c/code\u003e until this page is reloaded.\u003c/p\u003e\n      \u003c/details\u003e\n    `;\n    attachReportActions(result);\n  }\n\n  async function run() {\n    assertInstagramOrigin();\n\n    const username = getTargetUsername();\n\n    if (!username) {\n      throw new Error(\"Open an Instagram profile page or provide a username.\");\n    }\n\n    const target = await loadProfileUser(username);\n\n    setStatusBar(\"Profile loaded\", 1, 1);\n    progress(\n      `Resolved @${target.username}: ${formatNumber(target.followerCount)} followers, ${formatNumber(target.followingCount)} following`,\n      \"profile\",\n    );\n\n    const viewerId = getCookie(\"ds_user_id\");\n    const selfRelationship = Boolean(viewerId \u0026\u0026 viewerId === target.id);\n    const batchVerification = Boolean(\n      CONFIG.batchVerify\n      \u0026\u0026 selfRelationship\n      \u0026\u0026 getCookie(\"csrftoken\"),\n    );\n    const verificationMethod = batchVerification\n      ? \"batch friendship checks plus individual rechecks\"\n      : \"exact follower search\";\n    const resume = loadResumeState(target.id);\n    const warnings = [];\n\n    activeResumeContext = { targetId: target.id, resume };\n\n    if (\n      resume.loadedFromStorage\n      \u0026\u0026 (Object.keys(resume.lists).length \u003e 0 || Object.keys(resume.verdicts).length \u003e 0)\n    ) {\n      warnings.push(`Reused saved progress from ${resume.ageMinutes} minutes ago to avoid repeating list requests. Saved not-following-back results are rechecked before appearing in the final list.`);\n    }\n\n    if (batchVerification) {\n      setStatusBar(\"Self-check mode\", 1, 1);\n      progress(\n        \"You are checking your own account: tentative misses will be verified with exact batch friendship checks (far fewer requests).\",\n        \"profile\",\n      );\n    }\n\n    const followingLoad = await loadRelationshipList(\"following\", target, resume);\n    const followingListUnavailable = (\n      followingLoad.usersByUsername.size === 0\n      \u0026\u0026 (typeof target.followingCount !== \"number\" || target.followingCount \u003e 0)\n    );\n    const useFollowingStatusHints = Boolean(\n      selfRelationship\n      \u0026\u0026 CONFIG.includeFollowingStatusHints !== false\n    );\n    let followingFeedHintLoad = {\n      passes: [],\n      stoppedEarly: false,\n      stopReason: \"\",\n      stopStatus: \"\",\n    };\n\n ingAccounts.some((account) =\u003e typeof account.followsViewer === \"boolean\");\n    const tentativeMisses = [];\n\n    if (!followerListUnavailable \u0026\u0026 !followingListUnavailable) {\n      const tentativeByUsername = new Map();\n\n      for (const account of followingAccounts) {\n        const username = normalizeUsername(account.username);\n\n        if (!username) {\n          continue;\n        }\n\n        if (\n          !followerLoad.usersByUsername.has(username)\n          || (useFollowingStatusHints \u0026\u0026 account.followsViewer === false)\n        ) {\n          tentativeByUsername.set(username, account);\n        }\n      }\n\n      tentativeMisses.push(\n        ...[...tentativeByUsername.values()]\n          .sort((left, right) =\u003e left.username.localeCompare(right.username)),\n      );\n    }\n    const verifiedNotFollowingBack = [];\n    const correctedByExactSearch = [];\n    const unknown = [];\n    let authLost = false;\n\n    if (followerListUnavailable || followingListUnavailable) {\n      setStatusBar(\"Verification blocked\", 0, 1);\n      progress(\n        \"Stopped safely before exact verification because Instagram blocked a required relationship list. No accounts were counted.\",\n        \"blocked\",\n      );\n    } else {\n      setStatusBar(\"Verification queued\", 0, tentativeMisses.length);\n      progress(\n        `Verifying ${tentativeMisses.length} tentative misses with ${verificationMethod}. Unknowns will not be counted as not following back.`,\n        \"exact verification\",\n      );\n\n      const configuredPreviousUnknowns = new Set(\n        (\n          Array.isArray(CONFIG.previousUnknownUsernames)\n            ? CONFIG.previousUnknownUsernames\n            : String(CONFIG.previousUnknownUsernames || \"\").split(\",\")\n        )\n          .map(normalizeUsername)\n          .filter(Boolean),\n      );\n      const retryablePreviousUnknownKeys = new Set();\n      const recordVerdict = (account, followsB   <script>
    const payload = JSON.parse(document.getElementById("copy-data").textContent);
    const itemsEl = document.getElementById("items");
    const statusEl = document.getElementById("status");
    const fallbackEl = document.getElementById("fallback");
    const fallbackText = document.getElementById("fallbackText");

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.style.color = isError ? "#f0b36a" : "#98d8aa";
    }

    function showFallback(text) {
      fallbackText.value = text;
      fallbackEl.classList.add("visible");
      fallbackText.focus();
      fallbackText.select();
      setStatus("clipboard access was blocked. select and copy from the manual box.", true);
    }

    async function copyText(item) {
      try {
        if (!navigator.clipboard?.writeText) {
          throw new Error("Clipboard API unavailable");
        }

        await navigator.clipboard.writeText(item.content);
        fallbackEl.classList.remove("visible");
        setStatus(item.title + " copied to your clipboard.");
      } catch {
        showFallback(item.content);
      }
    }

    function renderItem(item) {
      const article = document.createElement("article");
      article.className = "item";

      const head = document.createElement("div");
      head.className = "item-head";

      const title = document.createElement("h2");
      title.textContent = item.title;

      const description = document.createElement("p");
      description.textContent = item.description;

      const meta = document.createElement("div");
      meta.className = "meta";

      const file = document.createElement("code");
      file.textContent = item.file;

      const size = document.createElement("span");
      size.textContent = item.size;

      meta.append(file, size);
      head.append(title, description, meta);

      const actions = document.createElement("div");
      actions.className = "actions";

      const copy = document.createElement("button");
      copy.type = "button";
      copy.textContent = item.buttonLabel;
      copy.setAttribute("aria-label", "copy " + item.title + " to clipboard");
      copy.addEventListener("click", () => copyText(item));

      const open = document.createElement("a");
      open.className = "button secondary";
      open.href = item.file;
      open.target = "_blank";
      open.rel = "noreferrer";
      open.textContent = "view source";

      actions.append(copy, open);
      article.append(head, actions);

      return article;
    }

    for (const item of payload.items) {
      itemsEl.appendChild(renderItem(item));
    }

    document.getElementById("selectFallback").addEventListener("click", () => {
      fallbackText.focus();
      fallbackText.select();
    });

    document.getElementById("closeFallback").addEventListener("click", () => {
      fallbackEl.classList.remove("visible");
      fallbackText.value = "";
    });
  </script>
